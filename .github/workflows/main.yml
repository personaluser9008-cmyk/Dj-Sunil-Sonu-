name: Build Dj Sunil Sonu APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Rename App to Dj Sunil Sonu
        run: |
          # strings.xml aur sabhi XML files mein Convx ko Dj Sunil Sonu se badalna
          find app/src/main/res -type f -name "*.xml" -exec sed -i 's/Convx/Dj Sunil Sonu/g' {} +
          sed -i 's/<string name="app_name">[^<]*<\/string>/<string name="app_name">Dj Sunil Sonu<\/string>/g' app/src/main/res/values/strings.xml || true
          
          # AndroidManifest.xml mein app label badalna
          if [ -f "app/src/main/AndroidManifest.xml" ]; then
            sed -i 's/android:label="Convx"/android:label="Dj Sunil Sonu"/g' app/src/main/AndroidManifest.xml
          fi
          
          # Gradle files aur Kotlin strings mein "Convx" ko "Dj Sunil Sonu" se badalna
          find . -type f \( -name "*.gradle" -o -name "*.kts" -o -name "*.kt" \) -exec sed -i 's/"Convx"/"Dj Sunil Sonu"/g' {} +

      - name: Set up JDK 17 & 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: |
            17
            21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dj-Sunil-Sonu-APK
          path: app/build/outputs/apk/**/*.apk
          
