      - name: Fix Package Name and Rename App
        run: |
          # 1. Galti se badle gaye package/namespace 'com.Dj Sunil Sonu' ko wapas 'com.convx' karein
          find . -type f \( -name "*.kts" -o -name "*.gradle" -o -name "*.kt" -o -name "*.xml" -o -name "*.json" \) -exec sed -i 's/com\.Dj Sunil Sonu/com.convx/gI' {} +

          # 2. Sirf App ke Display Name ko 'Dj Sunil Sonu' karein
          find app/src/main/res -type f -name "strings.xml" -exec sed -i 's/>Convx</>Dj Sunil Sonu</g' {} +
          sed -i 's/<string name="app_name">[^<]*<\/string>/<string name="app_name">Dj Sunil Sonu<\/string>/g' app/src/main/res/values/strings.xml || true
          sed -i 's/android:label="Convx"/android:label="Dj Sunil Sonu"/g' app/src/main/AndroidManifest.xml || true
          
